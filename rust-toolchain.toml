# The Rust that this repository is built, linted and tested with, locally and in CI. The workflows name the same version
# in `dtolnay/rust-toolchain@<version>`, and .github/scripts/check-rust-version.sh fails CI if they differ. To move to a
# newer release, change it here and in the workflows together, run ./clippy.sh and the tests, and commit all of it in
# one change.
#
# The minimum supported version, `rust-version` in Cargo.toml, is checked by the `msrv` job, which sets RUSTUP_TOOLCHAIN
# to override this file.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
