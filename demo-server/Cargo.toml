[package]
name = "demo-server"
version = "0.1.0"
edition = "2024"
description = "Actix-based static server that builds and serves the svg-dom-graph demo gallery"
repository = "https://github.com/ChrisWhealy/svg-dom-graph"
license = "MIT"
publish = false

[dependencies]
actix-web = "4"
actix-files = "0.6"

[dev-dependencies]
# Used only by build::unit_tests, to stage into a throwaway directory instead of the real target/ tree.
tempfile = "3"
