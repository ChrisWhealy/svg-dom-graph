[alias]
# Build the wasm demo and serve it via the Actix demo-server at http://127.0.0.1:8000/
#
# demo-server itself is a thin static-file server, not CPU-bound work. The wasm package it builds via `wasm-pack
# build` remains a release build regardless (that is wasm-pack's own default, independent of this alias), so
# demo-server's own profile has no effect on what actually needs to be fast.
demo = "run -p demo-server"

# Run Chrome DevTools Protocol based browser test crate
cdp-test = "test -p cdp-integration-test"

# Let the compiler use WebAssembly's 128-bit vector instructions.
# 
# The complex-number kernels in `demo-common/src/complex` are plain loops over arrays in which the real and imaginary
# values have been split, and with this flag LLVM turns them into `f64x2` and `f32x4` operations. Without it they are
# ordinary scalar (that is non-SIMD) code. Still correct, only slower.
#
# The browser must support WebAssembly SIMD (every current Chrome, Firefox and Safari does). One that does not will fail
# to load the whole demo, not fall back. Setting `RUSTFLAGS` in the environment replaces this flag, it does not add to
# it.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
