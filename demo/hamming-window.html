<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hamming(7,4) — svg-dom-graph</title>
    <link rel="stylesheet" href="style.css" />
</head>

<!-- The Hamming(7,4) scene in a window of its own. The gallery's own panel keeps the description and opens this page
     (see `build_hamming_demo`). `init_hamming_window` builds the scene here, then resizes this window to fit it. -->

<body>
    <section class="section active scene-window" id="hamming-window">
        <div class="canvas" id="hamming-diagram-stage">
        </div>
        <p id="hamming-window-error" class="demo-error" hidden></p>
        <!-- Said by a screen reader when an error is introduced or removed. It is here, not in the scene, because the
             scene is drawn again for each change, and a live region that is new each time may not be announced. -->
        <p id="hamming-announcement" role="status" aria-live="polite"
            style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">
        </p>
    </section>

    <script type="module">
        import init, { init_hamming_window } from "./pkg/svg_dom_graph_demo.js"

        try {
            await init()
            init_hamming_window()
        } catch (err) {
            const banner = document.getElementById('hamming-window-error')
            banner.textContent = `This demo failed to build: ${err}`
            banner.hidden = false
        }
    </script>
</body>

</html>
