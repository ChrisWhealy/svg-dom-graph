<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChaCha20 — svg-dom-graph</title>
    <link rel="stylesheet" href="style.css" />
</head>

<!-- The ChaCha20 scene in a window of its own. The gallery's own panel keeps the description and opens this page
     (see `build_chacha20_demo`). `init_chacha20_window` builds the scene here, then resizes this window to fit it. -->

<body>
    <section class="section active scene-window" id="chacha20-window">
        <div class="canvas" id="chacha20-diagram-stage">
        </div>
        <p id="chacha20-window-error" class="demo-error" hidden></p>
    </section>

    <script type="module">
        import init, { init_chacha20_window } from "./pkg/svg_dom_graph_demo.js"

        try {
            await init()
            init_chacha20_window()
        } catch (err) {
            const banner = document.getElementById('chacha20-window-error')
            banner.textContent = `This demo failed to build: ${err}`
            banner.hidden = false
        }
    </script>
</body>

</html>
