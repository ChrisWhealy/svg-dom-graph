[package]
name = "perf-harness-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Chris Whealy <chris@whealy.com>"]
description = "The Layer B runner of the performance harness: drives a real svg-dom-graph Scene in a browser"
license = "MIT"
# Not part of the published library. It is built on demand, with wasm-pack.
publish = false

[lib]
# `rlib` too, so that the counting allocator's arithmetic can be unit tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
perf-harness = { path = "../perf-harness", default-features = false }
svg-dom-graph = { path = ".." }
# The service simulator's controller and surface, which the service target of the recovery workload breaks. Its fault hook is the
# harness's and not the product's: only this build has it.
service-sim = { path = "../service-sim", features = ["fault-hook"] }
service-sim-engine = { path = "../service-sim-engine" }
svg-dom = "^0.2.17"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = ["Window", "Document", "Element", "HtmlElement", "HtmlCollection", "Node", "NodeList", "Performance", "console", "DomTokenList"]
