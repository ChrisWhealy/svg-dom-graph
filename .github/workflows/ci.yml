name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # The published crate is the library and nothing else. Cargo.toml names what it holds, and this checks what `cargo package` makes of that,
      # so that the tests, the harness, the simulator's evidence and the demos cannot be shipped to everyone who depends on the crate.
      - name: The published crate holds only the library
        run: |
          .github/scripts/test-check-package-contents.sh
          .github/scripts/check-package-contents.sh

      - name: Clippy (library + tests)
        run: cargo clippy --lib --tests -- -D warnings

      - name: Unit tests
        run: cargo test --all-features

      # The workspace's default-members is just the root package, so none of the above select demo-server — it
      # needs an explicit `-p` invocation, same as cdp-integration-test already gets in its own job below. It
      # builds and runs natively (it's an Actix static-file server, not wasm), so it belongs here rather than in
      # the `wasm` job, which is about the wasm32 *target* build specifically.
      - name: Clippy (demo-server)
        # --all-targets, not a plain `-p demo-server`: #[cfg(test)] code (build/unit_tests.rs) is only compiled in
        # test mode, so a plain clippy invocation here would silently never lint it at all.
        run: cargo clippy -p demo-server --all-targets -- -D warnings

      - name: Unit tests (demo-server)
        run: cargo test -p demo-server

      # demo-app is a cdylib (wasm-bindgen crate), but its highlight::unit_tests and
      # unit_tests::every_registered_demo_has_extractable_source are plain, DOM-free `#[test]`s that run natively —
      # the latter is what actually catches a demo_gallery! entry whose source text demo_fn_source can no longer
      # locate, so it needs to run somewhere in CI, not just pass locally.
      - name: Unit tests (demo-app)
        run: cargo test -p svg-dom-graph-demo

      # demo-common holds what the demos share (DOM helpers, the sorting visualisation). Its unit tests are
      # plain `#[test]`s that run natively, and `--all-targets` lints them too.
      - name: Clippy (demo-common)
        run: cargo clippy -p demo-common --all-targets -- -D warnings

      - name: Unit tests (demo-common)
        run: cargo test -p demo-common

      # cdp-deal.sh decides which CDP tests each shard runs. This checks it on a made-up list, with no browser.
      - name: Test how the CDP tests are dealt out to the shards
        run: .github/scripts/test-cdp-deal.sh

      # The CDP tests' own static file server is plain native code too, and the shards below run only the browser tests
      # (`--test cdp`), so its unit tests, such as the one that a query string is not part of a file's name, run here.
      # `--lib` selects them without starting a browser.
      - name: Unit tests (cdp-integration-test server)
        run: cargo test -p cdp-integration-test --lib

      # demo-server's own unit tests (build::unit_tests) already cover prepare_stage in isolation against the real
      # project, but this exercises the actual `cargo demo`-facing entry point — the same `--prepare-only` path CI
      # or a developer would use to check staging without paying for a full `wasm-pack build` (the `wasm` job below
      # already covers that separately). See demo-server/src/build/mod.rs's doc comment for why prepare_stage is
      # split out from build_demo.
      - name: Demo staging check (assemble index.html from demo/, no wasm build)
        run: cargo run -p demo-server -- --prepare-only

      - name: Docs (deny warnings)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: wasm build (library · demo-app)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (library, wasm32 target)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Build library for wasm32
        run: cargo build --lib --target wasm32-unknown-unknown

      # demo-app is a separate workspace member consuming svg-dom-graph only through its public API — building and
      # linting it here is a standing check that the library's public surface is sufficient for a real consumer, the
      # same reasoning svg-dom's own CI applies to its demo-app job.
      - name: Clippy (demo-app, wasm32 target)
        run: cargo clippy -p svg-dom-graph-demo -p demo-common --target wasm32-unknown-unknown -- -D warnings

      # The demo itself is built by the `cdp-build` job below, which runs the same `cargo run -p demo-server --
      # --build-only` pipeline as `cargo demo` and then hands the result to the CDP shards. Building it here as well
      # would only do the same work twice.

  # The performance harness's workload generator, its reference model, its native runner, the parts of its wasm runner that
  # need no browser, and its schemas. All of it runs on every commit. The independent JavaScript generator is the check that the stream does not depend on the
  # language, and the wasm32 run is the check that it does not depend on the width of an integer.
  perf-harness:
    name: perf harness (workloads · schemas)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Clippy (perf-harness, with and without the schema check)
        run: |
          cargo clippy -p perf-harness --all-targets -- -D warnings
          cargo clippy -p perf-harness --all-targets --no-default-features -- -D warnings

      - name: Unit tests (perf-harness)
        run: cargo test -p perf-harness

      # A browser build has no JSON-schema check, so the rules that the schema states have to hold without it too.
      - name: Unit tests (perf-harness, without the schema check)
        run: cargo test -p perf-harness --no-default-features

      - name: Clippy (perf-harness, wasm32 target)
        run: cargo clippy -p perf-harness --lib --target wasm32-unknown-unknown --no-default-features -- -D warnings

      # The same tests on a 32-bit platform, where the golden digests of the reference workloads must come out the same.
      - name: Unit tests (perf-harness, on 32-bit wasm under Node)
        run: cargo test -p perf-harness --no-default-features --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/perf/crosscheck/run-wasi.mjs

      # The Layer B runner needs a browser to run, and its allocator and parsers do not. The browser runs come with Phase 5.
      - name: Clippy (perf-harness-wasm, native and wasm32)
        run: |
          cargo clippy -p perf-harness-wasm --all-targets -- -D warnings
          cargo clippy -p perf-harness-wasm --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Unit tests (perf-harness-wasm)
        run: cargo test -p perf-harness-wasm

      - name: Rust and JavaScript generators agree
        run: node perf/crosscheck/crosscheck.mjs

      # Layer C attributes a frame to an input from a Chrome trace. The rule is tested on traces written out by hand, so it needs no
      # browser. Driving a real browser with it comes with Phase 5.
      - name: Frame attribution rule behaves as designed
        run: |
          node perf/lib/test-frames.mjs
          node perf/runner/test-walk-verdict.mjs

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      # The failed-import leak is wasm-bindgen's and not this crate's. The reproduction is expected to show it. A dependency update that
      # fixes it makes this step fail, which is the signal to remove the harness's accounting of the lost slots.
      - name: wasm-bindgen still loses an externref slot when an import that returns an object throws
        run: node perf/repro/wasm-bindgen-externref-slot/check.mjs --expect leak

      - name: JSON schemas accept what they should and refuse what they should not
        run: |
          npm ci
          npm test
        working-directory: perf/schemas

      # Reads the manifests with the TOML parser that the schemas' own dependencies bring, so it comes after `npm ci` above.
      - name: Fault contracts are well formed, cited, and what the manifests expect
        run: node perf/lib/test-contracts.mjs

      # The comparison, the reports and the promotion of baselines are tested on synthetic runs, with the real binary. A clean
      # fixture has to produce no regression, an injected slowdown has to produce one, and every refusal has to refuse.
      - name: Comparison and baseline promotion behave as designed
        run: |
          cargo build --release -p perf-harness
          node perf/lib/test-regression.mjs
          node perf/runner/test-promote-from-run.mjs

      # Workload W6's trace is worked out by the independent engine before anything is timed. The manifest seed has to qualify with the figures
      # that S0 froze, a seed that S0 refused has to be refused with its reason, and a trace with too few pops has to be refused whatever its slices.
      - name: The simulator workload's trace qualifies and refuses as it should
        run: node perf/runner/test-service-trace.mjs

      # The discrete-event service simulator's stage S0 prototype, which needs no browser. It reproduces the design's known answers,
      # and the seed-qualification gate that froze the generator's parameters, so a change to either cannot pass unnoticed.
      - name: Simulator prototype gives the design's known answers and qualifies its seeds
        run: |
          node dess/s0/prototype/test-prototype.mjs
          node dess/s0/prototype/qualify.mjs

      # Stage S1: the simulator's pure engine in Rust, and its oracle in JavaScript. The engine is linted and tested natively and as
      # 32-bit wasm, and the two engines are compared pop by pop and checkpoint by checkpoint on 1,200 scenarios, with the Rust one
      # built for both targets.
      - name: Simulator engine is linted and tested, natively and on 32-bit wasm
        run: |
          cargo clippy -p service-sim-engine --all-targets -- -D warnings
          cargo clippy -p service-sim-engine --lib --bins --target wasm32-wasip1 -- -D warnings
          cargo test -p service-sim-engine
          cargo test -p service-sim-engine --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/perf/crosscheck/run-wasi.mjs

      - name: Simulator engine agrees with its oracle, natively and on 32-bit wasm
        run: |
          cargo build --release -p service-sim-engine
          cargo build --release -p service-sim-engine --target wasm32-wasip1 --bin dess-trace
          node dess/reference-js/test-oracle.mjs
          node dess/s1/differential.mjs
          node dess/s1/differential.mjs --wasi

      # Stage S2: the projection of the engine's state is pure, so it is tested natively against the hand-audited E0 ledger. The
      # surface needs a browser, so it is only linted here, and its tests run in the `browser-tests` job.
      - name: Simulator projection is linted and tested, and its surface is linted for the browser
        run: |
          cargo clippy -p service-sim --all-targets -- -D warnings
          cargo clippy -p service-sim --all-targets --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p service-sim --lib --target wasm32-unknown-unknown -- -D warnings
          cargo test -p service-sim --lib

      # The sparse-matrix scale demonstrator (coverage audit, scenario D). Its core is pure, so it is linted and tested natively and as
      # 32-bit wasm, and compared with an oracle written from the contract alone. Its scene needs a browser, so here it is only linted.
      - name: Sparse-matrix core and scene are linted and tested, and the core on 32-bit wasm
        run: |
          cargo clippy -p spmv-core -p spmv-scene --all-targets -- -D warnings
          cargo clippy -p spmv-scene --all-targets --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p spmv-core --lib --bins --target wasm32-wasip1 -- -D warnings
          cargo test -p spmv-core -p spmv-scene
          cargo test -p spmv-core --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/perf/crosscheck/run-wasi.mjs

      - name: Sparse-matrix core agrees with its oracle, natively and on 32-bit wasm
        run: |
          cargo build --release -p spmv-core
          cargo build --release -p spmv-core --target wasm32-wasip1 --bin spmv-trace
          node spmv/reference-js/test-oracle.mjs
          node spmv/differential.mjs
          node spmv/differential.mjs --wasi

  # The profile that runs on every commit (design section 8). It fails on an incorrect checkpoint, a leaked deterministic
  # resource, a stream that is not the intended one or a result that does not satisfy its schema. It never fails on a timing: the
  # comparison with a baseline is written to the job summary and to the artifact, and with the three repetitions of a smoke run it
  # is labelled diagnostic and gives no verdict. The statistical verdicts block a change only from a baseline of 10 runs on one
  # runner class (section 8.1), and perf-smoke is not given `--enforce-statistical` until there is one.
  perf-smoke:
    name: perf smoke (W1 to W4 and W6 · baseline comparison report)
    runs-on: ubuntu-24.04
    env:
      PERF_RUNNER_CLASS: github-ubuntu-24.04
      # The runner's Chrome runs without its sandbox, as the CDP shards do, since the sandbox needs a privilege the runner lacks.
      PERF_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: Install the schemas' dependencies
        run: npm ci
        working-directory: perf/schemas
      - name: Chrome version (the runner image ships one)
        run: |
          echo "CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)" >> "$GITHUB_ENV"
          google-chrome --version || google-chrome-stable --version || chromium-browser --version

      - name: Run the smoke workloads and compare them with the baseline
        run: node perf/runner/perf-smoke.mjs

      # The sparse-matrix demo is driven as a person would use it, in the window that the gallery's panel opens: every list and button is
      # in a foreignObject of its one svg, the graph pans and zooms, a click on a node lights its edges and writes out its arithmetic, a run
      # stops when asked and when the window is hidden, a size over the budget is refused before the page is touched, and ten rebuilds
      # leave the page as it was.
      - name: Sparse-matrix demo behaves
        run: |
          cargo run -p demo-server -- --build-only
          node spmv/panel-smoke.mjs

      # The simulator's controller is told that a gallery panel was hidden by a hint, and tests whether it may draw with a synchronous
      # predicate. The real gallery has to order the hint, a timer queued before the hide, and the predicate as the design needs.
      - name: The real gallery orders a hide, its hint and a queued timer
        run: |
          cargo run -p demo-server -- --build-only
          node dess/s3/gallery-order.mjs

      # Historical runs are kept as artifacts and never committed. A baseline is committed only by the promotion command.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke-${{ github.sha }}
          path: target/perf-smoke
          retention-days: 90

  # The proofs that the harness would notice, which take about nine minutes each and are the slowest things that CI does. They are jobs of their own,
  # so that they run beside the smoke workloads and not after them, and a commit waits for the longest and not for the sum.
  #
  # regression: a slowdown and a leak are put into a candidate on purpose, and a clean one is not.
  #
  # w6: workload W6's runners are shown to refuse, reject and fail where they should: a refused seed, a wrong checkpoint, a controller that reads
  # layout, a shifted window, seeds over 2**53, a manifest held to its layers, and a late Pause being an extra tick. The classification of three
  # repetitions as diagnostic and five as not, which runs the manifests eight times, is on the nightly profile. Play costs 40 seconds a repetition and
  # is there too, so only the late-Pause protocol check, which is about 20 seconds, runs here.
  perf-selftests:
    name: perf self-tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: harness catches an injected regression and leak
            run: node perf/runner/selftest-regression.mjs
          - name: simulator runners refuse, reject and fail
            run: node dess/s5/selftest.mjs --skip-classification
          # The session coordinator's tests are shown to fail when the coordinator is wrong: thirteen small breakages, one at a time, in a copy of the tree.
          - name: gallery panel session coordinator mutation check
            run: node dess/demo-panel/p1/mutation-check.mjs
          # The gallery panel's P0 proofs (dess/demo-panel/p0): that a scene can be staged in a connected host that cannot be seen, focused, clicked
          # or heard, and that the page injector's detach mode fires where it is armed and leaves its other user, the graph recovery self-test, alone.
          - name: gallery panel staging and injector proofs
            run: |
              node dess/demo-panel/p0/staging.mjs
              node dess/demo-panel/p0/injector.mjs
              node dess/demo-panel/p0/injector-mutation-check.mjs
              node dess/demo-panel/p0/features.mjs
    env:
      PERF_RUNNER_CLASS: github-ubuntu-24.04
      PERF_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: Install the schemas' dependencies
        run: npm ci
        working-directory: perf/schemas
      - name: Chrome version (the runner image ships one)
        run: |
          echo "CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)" >> "$GITHUB_ENV"
          google-chrome --version || google-chrome-stable --version || chromium-browser --version
      # The self-tests run the harness without building it, so it is built here, as perf-smoke builds it before its first run.
      - name: Build the harness
        run: |
          cargo build --release -p perf-harness
          wasm-pack build perf-harness-wasm --target web --release --out-dir pkg
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  library-version:
    name: published library version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit to compare with is not in a shallow clone.
          fetch-depth: 0
      - name: Test the version check
        run: .github/scripts/test-check-library-version.sh
      # A change to src/ must not go into a version that crates.io already has, so it needs a new version only after the
      # next publish. Any number of changes can go into one that is not published yet. A change to the demos or the tests
      # needs none, and goes in demo/CHANGELOG.md instead.
      - name: A change to the library must go into a version higher than the one currently published
        run: .github/scripts/check-library-version.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the library builds on the declared MSRV
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: Check demo-app builds on the declared MSRV
        run: cargo check -p svg-dom-graph-demo -p demo-common --target wasm32-unknown-unknown

  browser-tests:
    name: wasm-pack test (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      # Don't let one engine failing cancel the other — we want to see which broke.
      fail-fast: false
      matrix:
        browser: [firefox, chrome]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The jobs are pinned to ubuntu-24.04 and not to ubuntu-latest, which moves to Ubuntu 26 from October 2026 and would change the browsers, the
      # kernel and this sandbox rule under a green build. Moving to a newer image is a change that is made on purpose. Ubuntu 24.04 enables AppArmor's unprivileged-user-namespace
      # restriction by default. Firefox's (and Chromium's) content sandbox needs one, so headless launch fails
      # without this. Tracked upstream at https://github.com/actions/runner-images/issues/10015.
      - name: Allow unprivileged user namespaces (Firefox/Chromium sandbox needs this on Ubuntu 24.04 runners)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # See the `cdp-build` job's own `Install wasm-pack` step for why this uses taiki-e/install-action rather than
      # jetli/wasm-pack-action.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      # wasm-bindgen-test-runner reads webdriver.json (at the repo root, next to Cargo.toml) for extra per-browser
      # capabilities. It adds Chrome's --disable-dev-shm-usage. Since the container default shared memory is small, if a
      # headless Chrome/chromedriver on this runner tries to allocate too much memory, it will be killed outright by a
      # SIGKILL and result in the error message "driver failed to bind port during startup".  This is a known
      # headless-Chrome-in-CI failure mode that is distinct from the AppArmor/unprivileged-userns issue the sysctl step
      # above addresses.
      #
      # Firefox is unaffected, since webdriver.json currently contains no moz:firefoxOptions.
      - name: Run the browser integration tests
        run: wasm-pack test --headless --${{ matrix.browser }}

      # The simulator surface has been run in Chrome only, so Firefox is not asked until it has been run there.
      # This runs the surface's tests and the controller's, which are on the real surface with the page's own timers and frames.
      - name: Run the simulator surface and controller tests
        if: matrix.browser == 'chrome'
        run: wasm-pack test --headless --chrome service-sim

      # The sparse-matrix scene has been run in Chrome only, so Firefox is not asked until it has been run there. Its measurements are
      # ignored tests that nothing here runs, since a timing is never a gate.
      - name: Run the sparse-matrix scene tests
        if: matrix.browser == 'chrome'
        run: wasm-pack test --headless --chrome spmv-scene --test browser

  # The lints are their own job so that they run once, not once for every shard of the tests below.
  cdp-lint:
    name: CDP clippy (fixture · tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # cdp-test-fixture is a `cdylib` (wasm-bindgen crate) with no test targets of its own, so a plain `-p`
      # invocation under the wasm32 target already covers all its compiled code.
      - name: Clippy (cdp-test-fixture)
        run: cargo clippy -p cdp-test-fixture --target wasm32-unknown-unknown -- -D warnings

      # Native, not `--target wasm32-unknown-unknown`: cdp-integration-test itself runs on the host (it drives a
      # real local Chrome via headless_chrome), so its own compiled code — including the `cdp` test binary under
      # `tests/cdp/` — only exists under the native target. --all-targets, not a plain `-p cdp-integration-test`:
      # #[cfg(test)] code (the `cdp` test binary) is only compiled in test mode, so a plain clippy invocation here
      # would silently never lint it at all.
      - name: Clippy (cdp-integration-test)
        run: cargo clippy -p cdp-integration-test --all-targets -- -D warnings

  # Builds, once, the two wasm packages that every CDP shard serves: the demo gallery and the cdp-test-fixture. The
  # shards download the result instead of each compiling the 25,000 lines of the demo for wasm again. See
  # `PREBUILT_VAR` in cdp-integration-test/src/lib.rs for how the tests are told to use it.
  #
  # `cargo run -p demo-server -- --build-only`, not a hand-written `wasm-pack build demo-app ...` invocation:
  # demo-server's own build::build_wasm constructs that command programmatically (working directory, argument order,
  # an absolute --out-dir derived from StagePaths), and a hand-written approximation here could drift out of step with
  # it. --build-only runs demo-server's real build_demo pipeline (stage index.html, then that exact wasm-pack
  # invocation) without starting Actix, so this exercises the precise path `cargo demo` uses.
  cdp-build:
    name: Build the demo and the CDP fixture for the shards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # jetli/wasm-pack-action was previously used in CI, but its last release (v0.4.0, 2022) declares a `node16`
      # runtime, which GitHub has deprecated — every job using it now emits a dependency-maintenance warning even
      # though CI itself stays green, and there is no newer release to bump to. taiki-e/install-action is actively
      # maintained, already used elsewhere for other Rust tools, and installs wasm-pack straight from its own
      # GitHub Releases — pinning the tool version here (rather than the action's own "latest") keeps the same
      # reproducibility the previous pin gave. Bump deliberately when needed.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build the demo (cargo demo's own pipeline, without starting the server)
        run: cargo run -p demo-server -- --build-only

      - name: Build the CDP test fixture
        run: wasm-pack build --target web
        working-directory: cdp-test-fixture

      # Both paths are uploaded in one artifact, which keeps their paths relative to the repository root, so that
      # downloading it into the checkout puts each exactly where the tests look for it.
      - name: Share the builds with the shards
        uses: actions/upload-artifact@v7
        with:
          name: cdp-builds
          path: |
            target/demo-stage
            cdp-test-fixture/pkg
          if-no-files-found: error
          retention-days: 1

  # The CDP tests run in as many Chrome processes as there are shards, one on each runner, instead of one after the
  # other in a single Chrome. Run in one, they took over 25 minutes. See .github/scripts/cdp-shard.sh for how the tests
  # are dealt out. A test added to any module lands in some shard on its own, so adding a shard here is the only change
  # that making the run faster or slower ever needs.
  # The acceptance gate for the QR code demo's export: that what it saves can be scanned. The exports are made by an
  # ignored test of demo-app, and decoded by code that shares nothing with the encoder, so an ordinary `cargo test` cannot
  # show it. The versions are pinned, so that a result is the same on every run. pyzbar is a second decoder, and is
  # optional: a failure to install it does not fail the job, and the check runs without it. ZXing-C++ and python-qrcode
  # are not optional, and `--strict` fails the check if python-qrcode is missing. See .github/scripts/check-qr-exports.sh.
  qr-export-decoders:
    name: QR code export · ZXing-C++ · python-qrcode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the decoder and the oracle
        run: python -m pip install pillow==11.3.0 zxing-cpp==2.3.0 qrcode==8.2
      - name: Install pyzbar, the second decoder (optional)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes libzbar0
          python -m pip install pyzbar==0.1.9
      - name: Export the symbols and decode them
        run: .github/scripts/check-qr-exports.sh

  cdp-integration-test:
    name: CDP browser integration tests (Chrome, shard ${{ matrix.shard }} of 8)
    needs: cdp-build
    runs-on: ubuntu-24.04
    env:
      # The packages come from the `cdp-build` job, not from a build in this shard.
      CDP_PREBUILT: "1"
      # Each test appends how long it held the browser to this file, which is uploaded below. Those times are what
      # .github/cdp-timings.tsv is made from, and what the dealing of tests to shards goes by. See
      # .github/scripts/cdp-merge-timings.sh.
      CDP_TIMING_FILE: ${{ github.workspace }}/cdp-timings-${{ matrix.shard }}.tsv
    strategy:
      # One shard failing should not hide what the others found.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download the demo and fixture builds
        uses: actions/download-artifact@v8
        with:
          name: cdp-builds
          path: .
      # Unlike `browser-tests`, this job does not need the AppArmor/unprivileged-userns workaround: the shared
      # `launch_browser` helper (cdp-integration-test/src/lib.rs) launches Chrome with `.sandbox(false)`, precisely
      # so it never attempts the AppArmor-dependent sandbox initialisation that workaround exists for — see
      # `tests/cdp/main.rs`'s own `# Why the browser is launched with sandbox(false)` doc section. The
      # `sudo sysctl` step `browser-tests` needs has no effect here and is deliberately omitted.
      - name: Chrome version (diagnostic — the runner image ships one, nothing to install)
        run: google-chrome --version || google-chrome-stable --version || chromium-browser --version

      # Serves the prebuilt cdp-test-fixture and demo gallery locally, and drives the runner's own Chrome over the
      # DevTools Protocol — see the module doc comment in cdp-integration-test/tests/cdp/main.rs for what this verifies
      # and why it's a separate job rather than folded into `browser-tests`: it needs headless_chrome and a real local
      # Chrome binary, neither of which the wasm-bindgen-test-based browser tests require. The tests inside a shard
      # still take turns, as they do locally.
      - name: Run this shard of the CDP integration tests (real pointer drag, driven through the actual browser)
        run: .github/scripts/cdp-shard.sh ${{ matrix.shard }} 8

      # Uploaded even when a test failed, so that a failing run still tells how long the others took.
      - name: Keep the test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cdp-timings-${{ matrix.shard }}
          path: cdp-timings-${{ matrix.shard }}.tsv
          if-no-files-found: ignore
          retention-days: 30
