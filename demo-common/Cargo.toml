[package]
name = "demo-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "What the svg-dom-graph demos share: DOM helpers, SVG buttons and the sorting visualisation"
repository = "https://github.com/ChrisWhealy/svg-dom-graph"
license = "MIT"
publish = false

[dependencies]
svg-dom-graph = { path = ".." }
svg-dom = "0.2"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "CssStyleDeclaration",
    "Document",
    "SvgElement",
    "console",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "NodeList",
    "Window",
]
