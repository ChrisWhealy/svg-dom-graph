<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>perf harness</title>
</head>
<body>
  <script type="module">
    import init, { run_workload, run_candidate, verify_allocator, selftest_checker, selftest_timing, attribute_persistent, attribute_persistent_run, selftest_endurance, selftest_corruption, recovery_build, recovery_intend, recovery_act, recovery_snapshot, recovery_predicted, recovery_differences, recovery_node_rect, recovery_counts, recovery_teardown, recovery_drop_scene, recovery_forget, sim_build, sim_batch, sim_step, sim_repair, sim_set_speed, sim_state, sim_teardown, service_build, service_act, service_checkpoint, service_hook, service_hook_calls, service_attach, service_show_panel, service_counts, service_teardown, service_forget, describe_metric, resource_reading, endurance_verdict, leak_bytes, reserve_handles, tracking_start, tracking_stop_and_dump } from "./pkg/perf_harness_wasm.js"
    import { runRecovery, runEndurance } from "./recovery.js"
    import { runServiceRecovery, runServiceEndurance } from "./service-recovery.js"
    import { runSimulationCorrectness, runSimulationPerformance, runSimulationEndurance, simulationControls } from "./service-sim.js"
    const wasm = await init()
    // The runner drives these from outside, through the DevTools Protocol.
    window.perfHarness = { run_workload, run_candidate, verify_allocator, selftest_checker, selftest_timing, attribute_persistent, attribute_persistent_run, selftest_endurance, selftest_corruption, recovery_build, recovery_intend, recovery_act, recovery_snapshot, recovery_predicted, recovery_differences, recovery_node_rect, recovery_counts, recovery_teardown, recovery_drop_scene, recovery_forget, sim_build, sim_batch, sim_step, sim_repair, sim_set_speed, sim_state, sim_teardown, service_build, service_act, service_checkpoint, service_hook, service_hook_calls, service_attach, service_show_panel, service_counts, service_teardown, service_forget, describe_metric, resource_reading, endurance_verdict, leak_bytes, reserve_handles, tracking_start, tracking_stop_and_dump }
    // How many JavaScript objects the wasm module is holding on to, by wasm-bindgen's table of externrefs. Its length is the high-water
    // mark and the count of occupied slots is what is held now. The table is the slab whose doubling shows in the live bytes.
    window.perfHarness.held_handles = () => {
      const table = wasm.__wbindgen_externrefs
      let held = 0
      let undefinedSlots = 0
      for (let slot = 0; slot < table.length; slot++) {
        const value = table.get(slot)
        if (value === undefined) undefinedSlots++
        else if (value !== null) held++
      }
      // A slot that holds `undefined` was filled by the glue as the result of an import that then threw, and nothing frees it. A
      // free slot holds null. Four slots at the start hold the constants undefined, null, true and false.
      return { held, undefinedSlots, capacity: table.length }
    }
    window.perfHarness.recovery_endurance = (manifestJson, testing = '{}') => JSON.stringify(runEndurance(window.perfHarness, JSON.parse(manifestJson), JSON.parse(testing)))
    window.perfHarness.service_recovery_run = async (manifestJson, testing = '{}') => JSON.stringify(await runServiceRecovery(window.perfHarness, JSON.parse(manifestJson), JSON.parse(testing)))
    window.perfHarness.service_recovery_endurance = async (manifestJson, testing = '{}') => JSON.stringify(await runServiceEndurance(window.perfHarness, JSON.parse(manifestJson), JSON.parse(testing)))
    window.perfHarness.sim_c = simulationControls(window.perfHarness)
    window.perfHarness.sim_run = async (mode, manifestJson, traceJson, testingJson = '{}') => {
      const run = { correctness: runSimulationCorrectness, performance: runSimulationPerformance, endurance: runSimulationEndurance }[mode]
      if (!run) throw new Error(`workload W6 has no mode ${mode} in Layer B`)
      const manifest = JSON.parse(manifestJson)
      // A seed over 2**53 is rounded by a number, so its text is taken from the canonical manifest as it was written, and is what the wasm is given.
      manifest.seed_text = /"seed":(\d+)/.exec(manifestJson)[1]
      return JSON.stringify(await run(window.perfHarness, manifest, JSON.parse(traceJson), JSON.parse(testingJson)))
    }
    window.perfHarness.recovery_run = (manifestJson, testing = '{}') => JSON.stringify(runRecovery(window.perfHarness, JSON.parse(manifestJson), JSON.parse(testing)))
  </script>
</body>
</html>
