[package]
name = "externref-slot-repro"
version = "0.0.0"
edition = "2021"
publish = false
description = "A minimal reproduction: a wasm-bindgen import that returns an object and throws loses one externref slot for each throw"

# Not part of the svg-dom-graph workspace. It is built on its own, with `wasm-pack test --node`, so that it shows the behaviour
# with nothing of this repository in the way: no DOM, no web-sys, no svg-dom, no svg-dom-graph.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The version is pinned so that the result is for a version. Change it to try another, or run `check.mjs --version X.Y.Z`.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
wasm-bindgen-test = "0.3"
