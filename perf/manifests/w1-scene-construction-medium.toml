# W1, scene construction, at a size where construction takes a few milliseconds: 200 nodes and 600 edges, built 45 times.
# The first 5 are the warm-up. Every cycle builds the same graph, then drops the scene and removes its host.
schema_version = 1
workload = "scene_construction"
seed = 777
prng = "splitmix64"

[graph]
nodes = 200
edges = 600
maximum_degree = 16

[execution]
modes = ["correctness", "performance"]
warmup_iterations = 5
measurement_iterations = 40
repetitions = 5

[measurement]
capture_dom_counts = true
capture_listener_tally = true
capture_heap = false
capture_wasm_capacity = true
capture_wasm_live_allocation = true
capture_frame_timing = false
checkpoint_every = 10

[checkpoint]
view = "unchanged"

[limits]
wall_ms = 300000
