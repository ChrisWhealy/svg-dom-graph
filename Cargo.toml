[workspace]
members = ["demo-app", "cdp-test-fixture", "cdp-integration-test"]
# Keep plain `cargo build` / `cargo test` focused on the library; the demo-app (a small worked example, consuming
# svg-dom-graph only through its public API) is built only on demand, via `./demo` or an explicit `-p` invocation,
# and the cdp-test-fixture wasm crate plus its headless_chrome-driven CDP tests are built only on demand via
# `cargo test -p cdp-integration-test` — mirroring svg-dom's own workspace shape.
default-members = ["."]

[package]
authors = ["Chris Whealy <chris@whealy.com>"]
name = "svg-dom-graph"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Plot SVG graphs using svg-dom"
keywords = ["svg", "wasm", "browser", "dom", "graph"]
categories = ["wasm", "web-programming", "rendering"]
repository = "https://github.com/ChrisWhealy/svg-dom-graph"
license = "MIT"
readme = "README.md"
exclude = [
    ".github/",
    "rustfmt.toml",
]

[dependencies]
svg-dom = "0.2"

# TEMPORARY: svg-dom's published 0.2.13 does not yet have Matrix2D::identity(), added locally alongside this
# crate's own change to use it. Remove this patch once a new svg-dom version containing it is published, and bump
# the version requirement above accordingly.
[patch.crates-io]
svg-dom = { path = "../svg-dom" }

[dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[dev-dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "EventTarget",
    "Node",
    "NodeList",
    "PointerEvent",
    "PointerEventInit",
    "Window",
]
