[workspace]
members = ["demo-app"]
# Keep plain `cargo build` / `cargo test` focused on the library; the demo-app (a small worked example, consuming
# svg-dom-graph only through its public API) is built only on demand, via `./demo` or an explicit `-p` invocation.
default-members = ["."]

[package]
authors = ["Chris Whealy <chris@whealy.com>"]
name = "svg-dom-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Dynamically re-routable connectors between SVG boxes, built on svg-dom"
license = "MIT"
publish = false

[dependencies]
svg-dom = "0.2"

[dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[dev-dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "EventTarget",
    "Node",
    "NodeList",
    "PointerEvent",
    "PointerEventInit",
    "Window",
]
