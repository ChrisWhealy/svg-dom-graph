[workspace]
members = [
    "demo-app",
    "demo-common",
    "demo-server",
    "cdp-test-fixture",
    "cdp-integration-test",
    "perf-harness",
    "perf-harness-wasm",
    "service-sim-engine",
    "service-sim",
    "spmv-core",
    "spmv-scene",
]
# Keep plain `cargo build` / `cargo test` focused on the library; the demo-app (a small worked example, consuming
# svg-dom-graph only through its public API) and demo-server (the Actix-based static server that builds and serves
# it — see demo-server/src/main.rs) are built only on demand, via `cargo demo` or an explicit `-p` invocation, and
# the cdp-test-fixture wasm crate plus its headless_chrome-driven CDP tests are built only on demand via
# `cargo test -p cdp-integration-test` — mirroring svg-dom's own workspace shape.
default-members = ["."]

# The butterfly benchmark is a workspace of its own: it is built twice, with different `RUSTFLAGS`, by its own `run.sh`.
# Use to benchmark any benefits that might come from using WASM SIMD instructions in large FFTs
exclude = ["bench-butterfly"]

[package]
authors = ["Chris Whealy <chris@whealy.com>"]
name = "svg-dom-graph"
version = "0.2.52"
edition = "2024"
rust-version = "1.85"
description = "Plot SVG graphs using svg-dom"
keywords = ["svg", "wasm", "browser", "dom", "graph"]
categories = ["wasm", "web-programming", "rendering"]
repository = "https://github.com/ChrisWhealy/svg-dom-graph"
license = "MIT"
readme = "README.md"

# What is published is named here, and nothing else.
#
# The workspace holds a many workspace crates that are not part of the library:
# * its integration and browser tests
# * the performance harness,
# * the simulator and its evidence,
# * the demos
# * the documentation.
#
# A list of what to leave out allows any new directory to leak into the published crate until someone remembers to
# add it to the exclusion list. Alternatively, a list of what to put in cannot suffer from such leaks.
#
# The script `.github/scripts/check-package-contents.sh` fails CI if the package holds anything not named here. The
# leading slash anchors a name to the crate's own directory, since a pattern without one matches a file of that name at
# any depth.
include = [
    "/src/**/*",
    "/README.md",
    "/LICENSE",
    "/changelog.md",
]

[dependencies]
# 0.2.14 implements Matrix2D::identity() - used by tests.
# 0.2.16 implements std::error::Error for svg-dom Error.
svg-dom = "^0.2.17"
# Used directly (not via svg-dom) by `scene::drag::PointerCoalescer`, to schedule at most one `requestAnimationFrame`
# per pending pointer-move, rather than applying every delivered pointer event immediately.
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusOptions",
    "HtmlInputElement",
    "KeyboardEvent",
    "WheelEvent",
    "Window",
]

[dev-dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

[dev-dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "DomRect",
    "Element",
    "ErrorEvent",
    "EventTarget",
    "FocusEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "MutationRecord",
    "MutationObserverInit",
    "MutationObserver",
    "MouseEventInit",
    "EventModifierInit",
    "WheelEvent",
    "WheelEventInit",
    "Node",
    "NodeList",
    "PointerEvent",
    "PointerEventInit",
    "Window",
]
