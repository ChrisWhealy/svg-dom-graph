[package]
name = "svg-dom-graph-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
svg-dom-graph = { path = ".." }
svg-dom = "0.2"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "Window",
]
