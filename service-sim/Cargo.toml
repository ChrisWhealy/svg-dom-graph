[package]
name = "service-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Chris Whealy <chris@whealy.com>"]
description = "The discrete-event service simulator's projection and SVG surface: what the engine's state looks like, and the Scene that shows it"
license = "MIT"
# Not part of the published library. It is built on demand, like perf-harness-wasm, and it adds no dependency to svg-dom-graph.
publish = false

[dependencies]
service-sim-engine = { path = "../service-sim-engine" }

# The surface needs a browser, so only the wasm target has these. The projection builds and is tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
svg-dom-graph = { path = ".." }
svg-dom = "^0.2.17"
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["Window", "Document", "Element", "Node", "NodeList", "SvgElement", "HtmlElement", "MutationObserver", "MutationObserverInit", "console", "EventTarget", "Event"]

# The tests detach the host in the middle of a draw, which needs a hook that no other build has.
[features]
fault-hook = []

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
service-sim = { path = ".", features = ["fault-hook"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.web-sys]
version = "0.3"
features = ["Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "Event", "FocusEvent"]
